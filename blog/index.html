---
layout: default
title: Blog
permalink: /blog/
---

<main>
    <div class="blog-container">
        <h1 class="pixel-title">Blog</h1>
        <p class="blog-kicker">Simple thoughts from a simple guy.</p>

        <section class="pixel-panel" aria-label="Posts">
            <ul class="blog-post-list">
                {% for post in site.posts %}
                <li>
                    {% if forloop.first %}<span class="latest-badge" aria-hidden="true">▸ LATEST</span>{% endif %}
                    <a href="{{ post.url }}">{{ post.title }}</a>
                    <div class="blog-meta">{{ post.date | date: "%b %-d, %Y" }}</div>
                </li>
                {% endfor %}
            </ul>
        </section>
    </div>
</main>
